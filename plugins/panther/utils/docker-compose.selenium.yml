# Selenium Grid (standalone Chrome) for Panther tests against a remote WebDriver.
# Source: panther-selenium-remote. Tests use createSeleniumClient(...) or the PANTHER_* variables.
services:
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: "2gb"            # verhindert Chrome-Crashes (/dev/shm zu klein)
    ports:
      - "4444:4444"            # WebDriver-Endpoint: http://localhost:4444/wd/hub
      - "7900:7900"            # noVNC (Live-Ansicht), Passwort: secret
    environment:
      - SE_NODE_MAX_SESSIONS=1

  # Example: your app/test container that tests against the grid.
  # tests:
  #   build: { context: ., dockerfile: utils/Dockerfile.panther }
  #   depends_on: [selenium]
  #   environment:
  #     # External web server/host that the remote browser reaches:
  #     - PANTHER_EXTERNAL_BASE_URI=http://app:8000
  #   command: vendor/bin/phpunit -c phpunit.panther.xml
